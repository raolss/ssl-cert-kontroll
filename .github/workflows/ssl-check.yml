name: SSL certificate expiry check

on:
  workflow_dispatch:
    inputs:
      warn_days:
        description: "Warn if cert expires within N days"
        required: false
        default: "30"
      crit_days:
        description: "Fail if cert expires within N days"
        required: false
        default: "7"
      timeout_sec:
        description: "Timeout per host (seconds)"
        required: false
        default: "8"
  schedule:
    - cron: "5 14 * * *"  #15:05 svensk tid

env:
  # Valfritt: opt-in till Node 24 redan nu (relaterat till varningen du såg)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ssl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SSL expiry check
        env:
          WARN_DAYS: ${{ inputs.warn_days || '30' }}
          CRIT_DAYS: ${{ inputs.crit_days || '7' }}
          TIMEOUT: ${{ inputs.timeout_sec || '8' }}
        run: |
          chmod +x scripts/check-ssl-expiry.sh
          scripts/check-ssl-expiry.sh targets.txt

      - name: Notify Teams (Workflows webhook)
        if: env.SSL_WARN != '0' || env.SSL_CRIT != '0'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        run: |
          payload=$(jq -n --arg text "SSL report: OK=${SSL_OK}, WARN=${SSL_WARN}, CRIT=${SSL_CRIT}. See Actions Summary for details." '{text:$text}')
          curl -sS -X POST -H "Content-Type: application/json" -d "$payload" "$TEAMS_WEBHOOK_URL"

